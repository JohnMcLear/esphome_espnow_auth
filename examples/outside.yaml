esphome:
  name: outside-node

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: ../components

logger:
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  fast_connect: true

api:

ota:
  platform: esphome

espnow_auth:
  role: outside
  shared_key: !secret espnow_key
