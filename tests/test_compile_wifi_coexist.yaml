esphome:
  name: test-wifi-coexist

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: ../components

logger:
  baud_rate: 115200

wifi:
  ssid: "MyNetwork"
  password: "MyPassword"
  reboot_timeout: 0s
  fast_connect: true

api:

ota:
  platform: esphome

espnow_auth:
  role: inside
  shared_key: "test-key-12345"
  channel: 6
